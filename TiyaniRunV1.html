<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TiyaniRunV1</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0c10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      color: #fff;
      user-select: none;
      padding: 10px;
    }
    .game-container {
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
      border: 4px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 2 / 1;
      touch-action: manipulation;
    }
    /* CRT Scanline Overlay Effect */
    .game-container::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 10;
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #78b7ed; /* Active Gameplay Sky */
      image-rendering: pixelated;
    }
    /* Top Left Return Button for In-Game Exit */
    .top-back-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 30;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
      padding: 6px 12px;
      border: 2px solid #555;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }
    .top-back-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }
    /* Home / Start Screen with Background Image */
    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.55)), url('background.png') center/cover no-repeat;
    }
    .title {
      font-size: clamp(24px, 5vw, 42px);
      font-weight: bold;
      color: #facc15;
      text-shadow: 4px 4px 0px #000;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      width: 100%;
      max-width: 280px;
    }
    .btn {
      width: 100%;
      text-align: center;
      text-decoration: none;
      color: #ffffff;
      border: 4px solid #000;
      padding: 12px 20px;
      font-size: clamp(14px, 3vw, 20px);
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #000;
      transition: all 0.1s ease;
      letter-spacing: 1px;
    }
    .start-btn {
      background-color: #dc2626;
    }
    .start-btn:hover {
      background-color: #ef4444;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #000;
    }
    .start-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #000;
    }
    .back-btn {
      background-color: #3b82f6;
    }
    .back-btn:hover {
      background-color: #60a5fa;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #000;
    }
    .back-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #000;
    }
    .instructions {
      margin-top: 16px;
      color: #ffffff;
      font-size: clamp(11px, 2.2vw, 14px);
      font-weight: bold;
      text-shadow: 2px 2px 3px #000;
    }
  </style>
</head>
<body>

  <div class="game-container" id="gameContainer">
    <!-- Persistent Exit Link for Mobile/Desktop -->
    <a href="/index.html.html" class="top-back-btn">⬅ Exit</a>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <!-- Home / Start Menu -->
    <div id="homeScreen" class="overlay-screen">
      <div class="title">NTSocial RUNNER</div>
      <div class="button-group">
        <button id="startBtn" class="btn start-btn">▶ START GAME</button>
        <!-- Replace href with your actual home page link -->
        <a href="index.html.html" class="btn back-btn">⬅ BACK TO WEBSITE</a>
      </div>
      <div class="instructions">TAP SCREEN or press <b>SPACE</b> to Play</div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const homeScreen = document.getElementById('homeScreen');
const startBtn = document.getElementById('startBtn');
const gameContainer = document.getElementById('gameContainer');

// --- Web Audio API Setup ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'jump') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(380, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'die') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  } else if (type === 'score') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  }
}

// --- Game State Variables ---
let gameState = 'START'; // 'START', 'RUNNING', 'GAMEOVER'
let score = 0;
let highScore = localStorage.getItem('pixel_runner_hi') || 0;
let speed = 6;
let frameCount = 0;
let groundY = 320;

// Parallax scrolling positions
let bgScroll = 0;
let midScroll = 0;

// Ground pebbles
const pebbles = Array.from({ length: 35 }, () => ({
  x: Math.random() * canvas.width,
  y: groundY + 8 + Math.random() * 65,
  size: Math.random() > 0.5 ? 3 : 2,
  color: Math.random() > 0.5 ? '#a38f6b' : '#8c7757'
}));

// --- Player Object ---
const player = {
  x: 80,
  y: groundY - 52,
  width: 28,
  height: 52,
  velocityY: 0,
  gravity: 0.65,
  jumpStrength: -12.5,
  isGrounded: true,
  animFrame: 0,
  
  jump() {
    if (this.isGrounded) {
      this.velocityY = this.jumpStrength;
      this.isGrounded = false;
      playSound('jump');
    }
  },

  update() {
    this.velocityY += this.gravity;
    this.y += this.velocityY;

    if (this.y >= groundY - this.height) {
      this.y = groundY - this.height;
      this.velocityY = 0;
      this.isGrounded = true;
    }

    if (frameCount % 6 === 0 && this.isGrounded) {
      this.animFrame = (this.animFrame + 1) % 2;
    }
  },

  draw() {
    ctx.save();
    ctx.translate(Math.floor(this.x), Math.floor(this.y));

    // Scarf Flutter (Behind Body)
    ctx.fillStyle = '#dc2626';
    const scarfOffset = (frameCount % 8 < 4) ? 0 : 2;
    ctx.fillRect(-14, 16 + scarfOffset, 16, 5);

    // Body (Black Tracksuit)
    ctx.fillStyle = '#18181b';
    ctx.fillRect(2, 16, 22, 22);

    // Red Tracksuit Stripe across chest & arms
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(2, 22, 22, 4);

    // Head (Skin Tone)
    ctx.fillStyle = '#5c3d2e';
    ctx.fillRect(4, 2, 18, 14);

    // Hair (Black)
    ctx.fillStyle = '#09090b';
    ctx.fillRect(4, 0, 18, 4);

    // Sunglasses
    ctx.fillStyle = '#000000';
    ctx.fillRect(10, 6, 12, 4);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(18, 6, 2, 2); // Glint

    // Scarf Collar
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(2, 14, 22, 4);

    // Legs & Running Animation
    ctx.fillStyle = '#18181b';
    if (!this.isGrounded) {
      ctx.fillRect(4, 38, 8, 8);
      ctx.fillRect(14, 38, 8, 4);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(2, 44, 10, 5);
      ctx.fillRect(14, 40, 8, 5);
    } else if (this.animFrame === 0) {
      ctx.fillRect(4, 38, 7, 8);
      ctx.fillRect(15, 38, 7, 6);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(2, 46, 9, 6);
      ctx.fillRect(15, 42, 9, 6);
    } else {
      ctx.fillRect(4, 38, 7, 6);
      ctx.fillRect(15, 38, 7, 8);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(4, 42, 9, 6);
      ctx.fillRect(13, 46, 9, 6);
    }

    ctx.restore();
  }
};

// --- Obstacle Manager (Cactus) ---
let obstacles = [];
let obstacleTimer = 0;

function createCactus(x) {
  return {
    x: x,
    y: groundY - 58,
    width: 24,
    height: 58,
    draw() {
      ctx.save();
      ctx.translate(Math.floor(this.x), Math.floor(this.y));

      ctx.fillStyle = '#000000';
      ctx.fillRect(-1, -1, 26, 60);

      ctx.fillStyle = '#65a30d';
      ctx.fillRect(0, 0, 24, 58);

      ctx.fillStyle = '#bef264';
      ctx.fillRect(4, 8, 4, 4);
      ctx.fillRect(14, 18, 4, 4);
      ctx.fillRect(6, 32, 4, 4);
      ctx.fillRect(16, 44, 4, 4);

      ctx.fillStyle = '#000000';
      ctx.fillRect(-11, 19, 12, 22);
      ctx.fillStyle = '#65a30d';
      ctx.fillRect(-10, 20, 10, 20);
      ctx.fillRect(-10, 20, 5, 5);

      ctx.restore();
    }
  };
}

function updateObstacles() {
  obstacleTimer++;
  if (obstacleTimer > Math.max(50, 110 - speed * 4)) {
    if (Math.random() > 0.3) {
      obstacles.push(createCactus(canvas.width + 20));
      obstacleTimer = 0;
    }
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].x -= speed;

    const pBox = { x: player.x + 4, y: player.y + 4, w: player.width - 8, h: player.height - 6 };
    const oBox = { x: obstacles[i].x - 6, y: obstacles[i].y, w: obstacles[i].width + 6, h: obstacles[i].height };

    if (
      pBox.x < oBox.x + oBox.w &&
      pBox.x + pBox.w > oBox.x &&
      pBox.y < oBox.y + oBox.h &&
      pBox.y + pBox.h > oBox.y
    ) {
      gameOver();
    }

    if (obstacles[i].x < -40) {
      obstacles.splice(i, 1);
    }
  }
}

// --- Background Rendering ---
function drawBackground() {
  ctx.fillStyle = '#78b7ed';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#facc15';
  ctx.fillRect(630, 45, 36, 36);
  ctx.fillRect(643, 35, 10, 6);
  ctx.fillRect(643, 85, 10, 6);
  ctx.fillRect(620, 58, 6, 10);
  ctx.fillRect(670, 58, 6, 10);

  bgScroll = (bgScroll + speed * 0.1) % canvas.width;
  ctx.fillStyle = '#ffffff';
  
  [100, 380, 680].forEach(cloudX => {
    let renderX = (cloudX - bgScroll + canvas.width) % canvas.width;
    ctx.fillRect(renderX, 60, 64, 16);
    ctx.fillRect(renderX + 12, 48, 40, 12);
  });

  ctx.fillStyle = '#6a9fc9';
  [150, 400, 620].forEach(distX => {
    let rX = (distX - bgScroll * 0.5 + canvas.width) % canvas.width;
    ctx.fillRect(rX, groundY - 30, 8, 30);
    ctx.fillRect(rX - 4, groundY - 20, 5, 10);
  });

  midScroll = (midScroll + speed * 0.35) % 180;
  for (let x = -midScroll; x < canvas.width + 180; x += 180) {
    ctx.fillStyle = '#c08060';
    ctx.fillRect(x, groundY - 60, 120, 60);
    ctx.fillStyle = '#a06040';
    ctx.fillRect(x + 4, groundY - 56, 112, 52);

    ctx.fillStyle = '#804828';
    for (let f = 0; f < 110; f += 12) {
      ctx.fillRect(x + 8 + f, groundY - 50, 4, 40);
    }
  }

  ctx.fillStyle = '#e6cd98';
  ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

  ctx.fillStyle = '#3a2b1c';
  ctx.fillRect(0, groundY, canvas.width, 3);

  pebbles.forEach(p => {
    if (gameState === 'RUNNING') p.x -= speed;
    if (p.x < 0) p.x = canvas.width;
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
  });
}

// --- UI & Text Rendering ---
function drawUI() {
  ctx.fillStyle = '#2d2115';
  ctx.font = '20px "Courier New", monospace';

  const sStr = String(Math.floor(score)).padStart(5, '0');
  const hsStr = String(Math.floor(highScore)).padStart(5, '0');

  ctx.fillText(`HI ${hsStr} ${sStr}`, canvas.width - 210, 38);

  if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = '32px "Courier New", monospace';
    ctx.fillText('G A M E   O V E R', canvas.width / 2, canvas.height / 2 - 15);

    ctx.font = '18px "Courier New", monospace';
    ctx.fillText('Tap Screen or Press SPACE', canvas.width / 2, canvas.height / 2 + 25);
    ctx.textAlign = 'left';
  }
}

function gameOver() {
  gameState = 'GAMEOVER';
  playSound('die');
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('pixel_runner_hi', highScore);
  }
}

function startGame() {
  initAudio();
  score = 0;
  speed = 6;
  obstacles = [];
  obstacleTimer = 0;
  gameState = 'RUNNING';
  homeScreen.style.display = 'none';
}

function handleInput() {
  if (gameState === 'START') {
    startGame();
  } else if (gameState === 'GAMEOVER') {
    startGame();
  } else {
    player.jump();
  }
}

// --- Main Game Loop ---
function loop() {
  frameCount++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawBackground();

  if (gameState === 'RUNNING') {
    player.update();
    updateObstacles();

    score += 0.15;
    speed += 0.001;

    if (Math.floor(score) > 0 && Math.floor(score) % 100 === 0 && score % 100 < 0.15) {
      playSound('score');
    }
  }

  player.draw();
  obstacles.forEach(o => o.draw());
  drawUI();

  requestAnimationFrame(loop);
}

// --- Event Listeners ---
startBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  startGame();
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    handleInput();
  }
});

// Touch controls for mobile responsiveness
gameContainer.addEventListener('touchstart', (e) => {
  // Prevent jump trigger when clicking external buttons
  if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON') return;
  e.preventDefault();
  handleInput();
}, { passive: false });

requestAnimationFrame(loop);
</script>
</body>
</html>
